l_english:
 amc_atlantic_foothold_title:0 "An Atlantic Foothold"
 amc_atlantic_foothold_desc:0 "Three settled towns on the eastern shores of North America can anchor a greater English enterprise. Supply their harbors and carry new settlers across the ocean."
 amc_sponsor_assembly_title:0 "Sponsor Colonial Assemblies"
 amc_sponsor_assembly_desc:0 "Our American colonies have grown beyond scattered outposts. Invest in their capitals and grant their assemblies room to administer a flourishing society. One day they may claim a place among the nations."
 amc_transition_tt:0 "To continue the American campaign, play an eastern-American colonial nation through the vanilla colonial release-and-play or independence route. The vanilla Form American Nation decision requires independence, peace, Administrative Technology 10, a core capital in Eastern America and ten cities there. It opens the American Century mission tree."
 amc_new_shores_title:0 "New Shores"
 amc_new_shores_desc:0 "Five thriving American towns mark the beginning of a society that can endure beyond the Atlantic crossing. The land already has peoples, histories and claims of its own; settlement will require negotiation as well as resolve."
 amc_colonial_ports_title:0 "Ports of the Atlantic"
 amc_colonial_ports_desc:0 "Markets in two eastern cities will bind our settlements to the Atlantic economy. Ships carry more than cargo: they carry skills, arguments and the news of a wider world."
 amc_assembly_title:0 "An American Assembly"
 amc_assembly_desc:0 "Ten settled, integrated provinces and a stable administration give our assembly something substantial to govern. The question is no longer whether America can prosper, but who shall decide its future."
 amc_continental_foothold_title:0 "A Continental Foothold"
 amc_continental_foothold_desc:0 "Ten integrated eastern cities give the republic a foundation. Beyond the mountains lies the Mississippi basin, a world of river commerce and contested sovereignty. Our continental future begins with that road."
 amc_citizen_soldiers_title:0 "Citizen Soldiers"
 amc_citizen_soldiers_desc:0 "Liberty cannot defend itself. Ten regiments with experience enough to stand together will form the first citizen army, a force answerable to the republic it protects."
 amc_liberty_at_last_title:0 "Liberty at Last"
 amc_liberty_at_last_desc:0 "The old sovereign commands us no longer. With independence secured, peace restored and an American capital held in our own right, we can begin the harder work of governing ourselves. Let the world take notice."
 amc_federal_compact_title:0 "The Federal Compact"
 amc_federal_compact_desc:0 "A declaration creates a nation in words; institutions must give those words endurance. Let ten integrated eastern provinces join in a republican compact, defining the powers of the union and the guarantees of its communities."
 amc_more_perfect_union_title:0 "A More Perfect Union"
 amc_more_perfect_union_desc:0 "Our compact must survive beyond its founding generation. A stable republic with a strong civic tradition can turn a fragile agreement into durable government. The promise remains unfinished for many, but its institutions can be made to last."
 amc_free_harbors_title:0 "Free Harbors"
 amc_free_harbors_desc:0 "A marketplace in our coastal American capital will give merchants a gateway to the republic. Let its wharves become a meeting place for American produce and the commerce of the Atlantic."
 amc_open_doors_title:0 "Open Doors"
 amc_open_doors_desc:0 "Three developed eastern cities, stable government and a federal compact can offer newcomers more than a precarious foothold. Welcome their labor and ambition while remembering that opportunity has never been shared equally."
 amc_workshop_republic_title:0 "A Workshop Republic"
 amc_workshop_republic_desc:0 "Production buildings in five integrated eastern cities will join skilled hands to American resources. Prosperity should be built here, not merely shipped across the ocean as raw material."
 amc_guard_the_coast_title:0 "Guard the Coast"
 amc_guard_the_coast_desc:0 "Ten ships and three American ports will protect the lifelines of the young republic. Before we can command the oceans, our own coast must be secure."
 amc.1.t:0 "A Constitution for the Union"
 amc.1.d:0 "Delegates gather to turn independence into a republic that can govern a continent. Some would enumerate strong federal powers to sustain public credit and administer the states. Others insist that local guarantees must shelter communities from distant authority. Both speak of liberty, though many who live beneath this flag remain excluded from its promises. The compact we choose will shape the union's institutions."
 amc.1.a:0 "Enumerate the powers of the federation."
 amc.1.b:0 "Entrench the guarantees of the communities."
 amc_atlantic_settlement:0 "Atlantic Settlement"
 desc_amc_atlantic_settlement:0 "Regular Atlantic crossings bring new settlers to our American enterprise."
 amc_assembly_investment:0 "Investment in the Assemblies"
 desc_amc_assembly_investment:0 "Resources entrusted to colonial institutions help their cities grow."
 amc_colonial_trade:0 "Colonial Atlantic Commerce"
 desc_amc_colonial_trade:0 "Our port markets connect a growing society to the Atlantic economy."
 amc_liberty_modifier:0 "The Spirit of Independence"
 desc_amc_liberty_modifier:0 "The achievement of independence lends confidence to our public institutions."
 amc_enumerated_powers:0 "Enumerated Federal Powers"
 desc_amc_enumerated_powers:0 "The federal compact equips the union to administer a growing territory."
 amc_local_guarantees:0 "Local Constitutional Guarantees"
 desc_amc_local_guarantees:0 "Recognized communities find a place within the new republican compact."
 amc_durable_union:0 "A Durable Union"
 desc_amc_durable_union:0 "A mature civic tradition gives republican government the strength to endure."
 amc_free_harbor:0 "Gateway of the Republic"
 desc_amc_free_harbor:0 "The capital's free harbor draws merchants and commerce to the republic."
 amc_open_doors_modifier:0 "A Republic of Opportunity"
 desc_amc_open_doors_modifier:0 "New arrivals and growing cities give American settlement fresh momentum."
 amc_workshop_economy:0 "The Workshop Economy"
 desc_amc_workshop_economy:0 "An integrated network of workshops begins to turn American resources into American prosperity."
 amc_citizen_army:0 "The Citizen Army"
 desc_amc_citizen_army:0 "Experienced citizens sustain the young republic's military establishment."
 amc_coastal_fleet:0 "The Coastal Fleet"
 desc_amc_coastal_fleet:0 "Our coastal fleet benefits from a network of American ports."
