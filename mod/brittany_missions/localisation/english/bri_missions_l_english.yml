l_english:
 bri_missions.1.t:0 "The Question of France"
 bri_diplomacy_preview_trigger:0 "The §YQuestion of France§! must be resolved before this mission can be completed."
 bri_review_diplomatic_path_title:0 "Review Our Diplomatic Course"
 bri_review_diplomatic_path_desc:0 "The future direction of Breton diplomacy remains unsettled. We may review the alternatives available to us before committing the duchy to either course."
 bri_missions.1.a:0 "France is the natural guarantor of our security."
 bri_missions.1.b:0 "Brittany shall answer to no foreign court."
 bri_missions.1.c:0 "The matter is settled. See that our policy reflects it."
 bri_missions.1.d:0 "Brittany must decide what place France will occupy in our foreign policy. We may seek lasting security within the French diplomatic sphere, accepting that close cooperation will inevitably bind our interests together, or preserve our freedom of action and construct an independent network of alliances. Before committing the duchy to either course, we may examine what each policy would demand of us."
 bri_french_sphere_preview_tt:0 "Preview the §YFrench Sphere§! diplomatic missions. This choice is §Gnot yet permanent§!."
 bri_autonomous_preview_tt:0 "Preview the §YAutonomous§! diplomatic missions. This choice is §Gnot yet permanent§!."
 bri_lock_diplomatic_path_tt:0 "§YPermanently adopt the currently displayed diplomatic mission path.§!\nThis decision §Rcannot be reversed§!."
 bri_french_sphere_preview_tt:0 "Preview the §YFrench Sphere§! diplomatic missions. This choice is §Gnot yet permanent§!."
 bri_autonomous_preview_tt:0 "Preview the §YAutonomous§! diplomatic missions. This choice is §Gnot yet permanent§!."
 bri_lock_diplomatic_path_tt:0 "§YPermanently adopt the currently displayed diplomatic mission path.§!\nThis decision §Rcannot be reversed§!."
 bri_seeds_of_the_renaissance_title:0 "Seeds of the Renaissance"
 bri_seeds_of_the_renaissance_desc:0 "New ideas are spreading across Europe, transforming scholarship, art, administration, and commerce. The Breton court must ensure that our duchy does not remain on the periphery of this intellectual revival."
 bri_breton_renaissance_modifier:0 "The Breton Renaissance"
 bri_breton_renaissance_modifier_desc:0 "The flourishing of Renaissance thought in Brittany has elevated the prestige of the Breton court and attracted scholars, administrators, and other talented minds."
 bri_renaissance_growth:0 "Patronage of the Renaissance"
 bri_renaissance_growth_desc:0 "The Breton court is actively encouraging the spread of Renaissance ideas."
 bri_breton_renaissance_reward_tt:0 "Gain §G1§! Base Tax in each owned province in the Brittany area."
 bri_breton_textiles_title:0 "Cloth for Sail"
 bri_breton_textiles_desc:0 "The cloth-producing lands of Brittany are well suited to the growth of a prosperous textile industry. By investing in local workshops and skilled craftsmen, Breton cloth can become an increasingly important source of wealth and commerce."
 bri_breton_shipbuilding_title:0 "Breton Shipbuilding"
 bri_breton_shipbuilding_desc:0 "The sheltered harbors of western Brittany offer an ideal foundation for a permanent center of naval construction. By concentrating craftsmen, supplies, and maritime infrastructure at Penn-ar-Bed, we can establish dockyards capable of supporting Breton ambitions upon the Atlantic."
 bri_brest_dockyards:0 "Brest Dockyards"
 bri_brest_dockyards_desc:0 "The extensive dockyards and naval facilities of Brest have made Penn-ar-Bed the heart of Breton naval construction and maintenance."
 bri_nantes_market_title:0 "The Nantes Market"
 bri_nantes_market_desc:0 "The markets of Nantes stand at the meeting point of Brittany's inland economy and the trade routes of the Loire and Atlantic. Expanding its commercial infrastructure will create new demand for Breton goods throughout the duchy."
 bri_demand_for_breton_cloth:0 "Demand for Breton Cloth"
 bri_demand_for_breton_cloth_desc:0 "The growing markets of Nantes have created a steady demand for the cloth produced in this region."
 bri_breton_renaissance_title:0 "The Breton Renaissance"
 bri_breton_renaissance_desc:0 "The ideas of the Renaissance have taken root in Brittany, bringing with them new approaches to art, scholarship, and government. By embracing these ideas, the Breton court can attract learned advisors and establish the duchy as a flourishing center of culture."
 bri_breton_merchant_marine_title:0 "A Breton Merchant Marine"
 bri_breton_merchant_marine_desc:0 "The prosperity of Brittany has long been tied to the sea. A substantial fleet of swift vessels will allow Breton merchants to carry our goods to foreign ports, protect our commerce, and seek new opportunities along the coasts of Europe."
 bri_breton_merchant_marine_modifier:0 "Breton Merchant Marine"
 bri_breton_merchant_marine_modifier_desc:0 "A growing fleet of Breton merchant vessels and their escorts has strengthened the duchy's maritime commerce and created a thriving community of sailors, shipwrights, and merchants."
 bri_metropole_compact_tt:0 "The owner must have fewer than §Y10§! owned provinces in §YEurope§!."
 bri_metropole_1:0 "Foundations of the Breton Metropole"
 bri_breton_metropole_1_title:0 "The Breton Metropole"
 bri_breton_metropole_1_desc:0 "Brittany has become more than a small duchy on the Atlantic fringe. Its cities, markets, industries, and ports now form the concentrated heart of a prosperous maritime state. By continuing to invest in the Breton homeland rather than dispersing our strength across Europe, we can make these lands support power far beyond their size."
 bri_metropole_1:0 "Foundations of the Breton Metropole"
 bri_metropole_1_desc:0 "Concentrated investment in the Breton homeland allows these provinces to support economic and military power far beyond what their size would normally permit."
 bri_metropole_1_each_province_tt:0 "Each owned province in the §YBrittany§! area gains the following conditional modifier:"
 bri_breton_metropole_reward_tt:0 "§YThe Breton Metropole modifiers remain active while [Root.GetName] owns fewer than 10 provinces in Europe.§!\n§YThe Breton Metropole will gain additional bonuses through later missions.§!"
 bri_question_of_france_title:0 "The Question of France"
 bri_question_of_france_desc:0 "Brittany stands beside one of the greatest powers of Europe. Friendship with France could secure the duchy against its enemies, but dependence upon the French crown may gradually erode our freedom of action. We must decide what place France will hold in Breton foreign policy."
 bri_french_sphere_choice_tt:0 "§YFrench Sphere Path:§!\nFocus on maintaining close relations with §YFrance§!. This path offers greater diplomatic security and can establish France as a §YHistorical Friend§!, but provides more modest long-term mission rewards."
 bri_autonomous_choice_tt:0 "§YBreton Autonomy Path:§!\nBuild an independent network of powerful allies and avoid relying upon §YFrance§! for Breton security. This path is more demanding, but provides stronger diplomatic and sovereignty-related rewards, including powerful permanent bonuses later in the tree."
 bri_french_path_test_title:0 "French Sphere"
 bri_french_path_test_desc:0 "Brittany has chosen to seek security through close cooperation with France."
 bri_secure_the_borders_title:0 "Secure the Breton Borders"
 bri_secure_the_borders_desc:0 "Brittany cannot hope to match the great powers surrounding us through force of arms alone. By cultivating dependable allies beyond our borders, we can ensure that any threat to the duchy carries consequences far beyond Brittany itself."
 bri_secure_the_borders_modifier:0 "A Network of Allies"
 bri_secure_the_borders_modifier_desc:0 "Our efforts to surround Brittany with dependable friends have strengthened the standing of the Breton crown and made our diplomats more persuasive abroad."
 bri_secure_the_borders_bonus_tt:0 "If §YFrance§! is not allied with §Y[Root.GetName]§! when this mission is completed, gain §G50§! Diplomatic Power."
 bri_strength_in_numbers_title:0 "Strength in Numbers"
 bri_strength_in_numbers_desc:0 "A single powerful friend may deter our enemies, but lasting security requires a broader network of trusted partners. By cultivating strong relationships across Europe, Brittany can ensure that no great power can easily isolate the duchy."
 bri_strength_in_numbers_trigger_tt:0 "Have at least §Y4 Allies§!, at least §Y2§! of whom have §Y150 Opinion§! of [Root.GetName] and at least §Y60 Trust§! with [Root.GetName]."
 bri_balance_of_power_title:0 "The Balance of Power"
 bri_balance_of_power_desc:0 "Brittany no longer stands at the edge of great-power politics as a minor state seeking protection. By cultivating powerful friends and powerful enemies alike, we have secured a place within the balance of Europe and proven that Breton diplomacy can shape affairs far beyond the duchy's borders."
 bri_breton_statecraft:0 "Breton Statecraft"
 bri_breton_statecraft_desc:0 "Generations of navigating the rivalries of Europe's great powers have given the Breton state an exceptional tradition of diplomacy and foreign policy."
 bri_military_self_reliance_title:0 "Military Self-Reliance"
 bri_military_self_reliance_desc:0 "Brittany once depended upon distant friends to deter the ambitions of stronger neighbors. No longer. Our armies now stand ready to defend the duchy without relying upon any foreign power, ensuring that Breton sovereignty rests upon Breton strength."
 bri_self_reliance_power_projection:0 "Breton Missions"
 bri_franco_breton_friendship_title:0 "Franco-Breton Friendship"
 bri_franco_breton_friendship_desc:0 "Brittany's position beside France makes hostility between our realms a dangerous prospect for both sides. By cultivating a close and durable friendship with the French crown, we can turn our greatest potential threat into the guarantor of Breton security."
 bri_friends_in_paris_title:0 "Friends in Paris"
 bri_friends_in_paris_desc:0 "Friendship with France must amount to more than pleasant words between our courts. By earning the confidence of the French crown and openly taking its side against those who would challenge it, Brittany can gain access to the networks of officials, financiers, and statesmen surrounding the French court."
 bri_franco_breton_commercial_pact_title:0 "Franco-Breton Commercial Pact"
 bri_franco_breton_commercial_pact_desc:0 "Breton merchants increasingly bring the wealth of distant shores into the ports of the Atlantic, while the markets of France offer a vast destination for our goods. By formalizing this exchange, Brittany can serve as a maritime gateway between France and the wider world."
 bri_franco_breton_commercial_pact:0 "Franco-Breton Commercial Pact"
 bri_franco_breton_commercial_pact_desc:0 "Privileged access to French markets has strengthened Breton commerce and encouraged the exchange of maritime knowledge, techniques, and institutions."
 bri_breton_access_to_overseas_trade:0 "Breton Access to Overseas Trade"
 bri_breton_access_to_overseas_trade_desc:0 "Close commercial cooperation with Brittany provides French merchants and officials with greater access to the maritime networks connecting Europe to distant markets."
 bri_franco_breton_entente_title:0 "The Franco-Breton Entente"
 bri_franco_breton_entente_desc:0 "What began as an arrangement born from Breton vulnerability has matured into a partnership between powers. French strength on land and Breton experience at sea have made cooperation profitable to both crowns, while decades of shared interests have ensured that neither realm need stand alone against the ambitions of Europe."
 bri_franco_breton_entente:0 "The Franco-Breton Entente"
 bri_franco_breton_entente_desc:0 "Long-standing military cooperation with France has strengthened Breton military institutions, allowing our armies to replenish their ranks more effectively while preserving the experience of generations of officers."
 bri_french_breton_naval_cooperation:0 "Breton Naval Cooperation"
 bri_french_breton_naval_cooperation_desc:0 "Close cooperation with Brittany's maritime establishment has exposed French officers and sailors to the accumulated experience of Breton seafaring and naval warfare."
 bri_atlantic_ambitions_title:0 "Atlantic Ambitions"
 bri_atlantic_ambitions_desc:0 "The great ocean beyond our shores has long defined the western frontier of Brittany. With the means to establish settlements abroad now at our disposal, we must look beyond the familiar coasts of Europe and prepare the expeditions that will carry Breton ambitions across the Atlantic."
 bri_atlantic_ambitions_modifier:0 "Breton Atlantic Expeditions"
 bri_atlantic_ambitions_modifier_desc:0 "Careful study of Atlantic winds, currents, and sailing routes has allowed Breton expeditions to venture far beyond the waters traditionally frequented by our mariners."
 bri_breton_foothold_claims_tt:0 "Gain permanent claims on all §YCenters of Trade§! and §YRiver Estuaries§! in the §YGuinea§! region."
 bri_breton_foothold_trigger_tt:0 "Own a core province on any continent other than §YEurope§!."
 bri_breton_foothold_title:0 "A Breton Foothold"
 bri_breton_foothold_desc:0 "Our preparations have borne fruit. Beyond the shores of Europe now stands a permanent Breton settlement, supplied by our ships and populated by those willing to seek their fortunes far from home. What began as an uncertain voyage across distant seas has become the first foothold of Brittany overseas."
 bri_prepare_the_defenses_title:0 "Prepare the Defenses"
 bri_prepare_the_defenses_desc:0 "The defense of Brittany cannot depend upon walls alone. The province chosen to anchor our defenses must possess the population and military infrastructure necessary to sustain a strong garrison and support the armies of the duchy."
 bri_prepare_the_defenses_trigger_tt:0 "Increase the §YBase Manpower§! of any owned province in the §YBrittany§! area by at least §G2§!."
 bri_missions.2.t:0 "The Defense of Brittany"
 bri_missions.2.desc:0 "Our investment in the military strength of the duchy has given us an opportunity to reconsider the organization of Brittany's defenses. The fortress at Brest guards an important harbor, but its position at the western extremity of the peninsula leaves much of the country exposed. Should Brest retain it, or shall we establish the principal Breton fortress elsewhere?"
 bri_missions.2.a:0 "Arvor. Where else?"
 bri_missions.2.b:0 "Brest, obviously. It was never in question."
 bri_missions.2.c:0 "Bro Wened. Must I decide everything myself?"
 bri_missions.2.d:0 "Nantes. Surely this was apparent."
 bri_missions.2.e:0 "Bro Roazhon. See that it is done."
 bri_breton_fortress:0 "Breton Defensive Center"
 bri_breton_fortress_desc:0 "This province has been chosen as the principal stronghold of Brittany, concentrating military infrastructure, garrison support, and defensive investment within its borders."
 bri_ocean_going_fleet_title:0 "An Ocean-Going Fleet"
 bri_ocean_going_fleet_desc:0 "The expansion of Breton commerce across the Atlantic demands more than merchant vessels alone. Distant possessions and valuable sea lanes must be protected by a fleet capable of operating far from our shores. With powerful warships sailing alongside our merchantmen and the finest vessel of the Breton fleet at their head, our maritime interests can be defended wherever they may reach."
 bri_ocean_going_fleet_modifier:0 "Guardians of Breton Commerce"
 bri_ocean_going_fleet_modifier_desc:0 "Years spent protecting distant trade routes and maintaining a permanent presence upon the Atlantic have produced a confident and experienced Breton navy."
 bri_colonial_americas_title:0 "Settle America"
 bri_colonial_americas_desc:0 "What began as isolated settlements has grown into a substantial Breton presence across the lands beyond the Atlantic. With towns, ports, and colonial administrations now firmly established, these possessions can begin to contribute meaningfully to the prosperity and power of the duchy."
 bri_colonial_americas_modifier:0 "Breton Colonial Administration"
 bri_colonial_americas_modifier_desc:0 "A more mature colonial administration has strengthened the flow of wealth from Breton possessions overseas while easing tensions between the crown and its increasingly important colonial subjects."
 bri_gateway_to_the_atlantic_title:0 "Gateway to Europe"
 bri_gateway_to_the_atlantic_desc:0 "The wealth of our overseas possessions now crosses the Atlantic beneath the protection of Breton warships. Nantes, already among the greatest cities of the duchy, is ideally placed to become the marketplace through which distant goods reach Brittany and the wider markets of Europe. With the support of our merchant class, we can transform the city into the commercial heart of our Atlantic enterprise."
 bri_growing_economy_title:0 "A Growing Economy"
 bri_growing_economy_desc:0 "The prosperity of our cities has created new opportunities for investment throughout the duchy. Artisans expand their workshops, merchants provide the capital for new enterprises, and increasingly productive towns demand ever greater works of construction. With prudent management, this growth may provide the foundations for an even greater transformation of our economy."
 bri_growing_economy_modifier:0 "Expanding the Breton Economy"
 bri_growing_economy_modifier_desc:0 "Growing revenues and an increasingly active commercial class have made ambitious construction projects both cheaper and easier to undertake."
 bri_brittany_production_income_desc:0 "from production in the §YBrittany§! area."
 bri_breton_manufactures_title:0 "Breton Manufactures"
 bri_breton_manufactures_desc:0 "The workshops that once served local markets have grown into increasingly sophisticated centers of production. By concentrating capital, labor, and expertise into larger enterprises, we can produce goods on a scale previously impossible and turn the growing wealth of our cities into a flourishing manufacturing economy."
 bri_flourishing_duchy_title:0 "A Flourishing Duchy"
 bri_flourishing_duchy_desc:0 "Peace and careful governance have allowed our cities and countryside to flourish. The authority of the crown is firmly established, our administration reaches every corner of the duchy, and a long period of stability has allowed commerce and settlement to thrive. We should seize upon these favorable conditions to encourage the further growth of our towns and cities."
 bri_flourishing_duchy_modifier:0 "A Flourishing Duchy"
 bri_flourishing_duchy_modifier_desc:0 "Stability, prosperity, and effective administration have created ideal conditions for the continued growth of our towns and cities."
 bri_cities_of_brittany_title:0 "Cities of Brittany"
 bri_cities_of_brittany_desc:0 "The towns of the duchy have grown into prosperous cities, drawing craftsmen, merchants, and capital from across the realm. New industries have taken root alongside older trades, allowing Brittany to produce increasingly sophisticated goods for both domestic consumption and foreign markets."
 bri_metropole_2_each_province_tt:0 "Each owned province in the §YBrittany§! area has its §YBreton Metropole§! modifier upgraded to:"
 bri_breton_metropole_2_title:0 "Breton Metropole II"
 bri_breton_metropole_2_desc:0 "The transformation of Brittany is no longer confined to its towns and countryside. Wealth from distant shores flows through our ports, manufactories sustain a growing productive economy, and our cities rival those of the great powers of Europe. The Breton homeland has become the prosperous heart of a state whose influence reaches far beyond its borders."
 bri_breton_metropole_2_reward_tt:0 "§YThe Breton Metropole modifiers remain active while [Root.GetName] owns fewer than 10 provinces in Europe.§!"
 bri_metropole_2:0 "The Breton Metropole"
 bri_brittany_rules_the_waves_title:0 "Brittany Rules the Waves"
 bri_brittany_rules_the_waves_desc:0 "The Breton navy has grown beyond the requirements of commerce or colonial defense. Our great ships now outnumber those of every rival power, and there is no sea upon which our admirals need fear an equal opponent."
 bri_brittany_rules_the_waves_modifier:0 "Brittany Rules the Waves"
 bri_brittany_rules_the_waves_modifier_desc:0 "The supremacy of the Breton battle fleet has reshaped our naval institutions around permanent oceanic dominance."
 bri_atlantic_monopoly_title:0 "Atlantic Monopoly"
 bri_atlantic_monopoly_desc:0 "The commerce of distant continents now converges upon our shores. Breton merchants dominate the markets of Bordeaux, and the wealth passing through its ports surpasses that of every competing center of trade. The Atlantic economy has become, in no small part, a Breton economy."
 bri_atlantic_monopoly_golden_age_tt:0 "If §Y[Root.GetName]§! has already experienced a Golden Age, it will become possible to proclaim another. If [Root.GetName] is currently in a Golden Age, its duration will instead be extended."
 bri_first_among_nations_title:0 "First Among Nations"
 bri_first_among_nations_desc:0 "The strength of a great power cannot rest upon wealth and reputation alone. Our armies rank among the largest in the world, their ranks are filled by professional soldiers, and massed batteries of artillery have become central to Breton warfare. Few states can now rival our capacity to wage war on land."
 bri_breton_artillery_supremacy:0 "Breton Artillery Supremacy"
 bri_breton_artillery_supremacy_desc:0 "Years of investment in professional armies and increasingly sophisticated artillery doctrine have made Breton cannon among the most effective weapons on the battlefield."
 bri_missions.3.t:0 "An Age of Iron"
 bri_missions.3.desc:0 "The enormous expansion of our artillery arm has transformed demand for iron across our realm and beyond. Foundries consume ever greater quantities of metal for cannon, shot, tools, fittings, and the equipment required to maintain armies on an unprecedented scale. Merchants have already begun to raise their prices accordingly."
 bri_missions.3.a:0 "Then let the foundries burn day and night!"
 bri_has_adm_advisor_5_tooltip:0 "Is employing an §YAdministrative§! Advisor with at least Skill §Y5§!."
 bri_has_dip_advisor_5_tooltip:0 "Is employing a §YDiplomatic§! Advisor with at least Skill §Y5§!."
 bri_has_mil_advisor_5_tooltip:0 "Is employing a §YMilitary§! Advisor with at least Skill §Y5§!."
 bri_metropole_3_each_province_tt:0 "Each owned province in the §YBrittany§! area has its §YBreton Metropole§! modifier upgraded to:"
 bri_breton_metropole_3_title:0 "Breton Metropole III"
 bri_breton_metropole_3_desc:0 "Brittany has become the beating heart of a global empire. The wealth of the world's oceans flows into our ports, our cities rank among the greatest on Earth, and the resources of distant lands sustain an unprecedented concentration of commerce, industry, and population within the duchy. What began as a determination to preserve and enrich our homeland has transformed Brittany into a metropole without equal."
 bri_metropole_3:0 "The Breton Metropole"
 bri_brittany_area_development_3_tt:0 "The §YBrittany§! area has at least §Y250§! total Development."
 bri_breton_metropole_3_reward_tt:0 "§YThe Breton Metropole modifiers remain active while [Root.GetName] owns fewer than 10 provinces in Europe.§!"
 bri_metropole_3_compact_tt:0 "§Y[Root.GetName]§! must own fewer than §Y10 provinces in Europe§! unless §YNo Rivals Remain§! has been completed."
 bri_no_rivals_remain_title:0 "No Rivals Remain"
 bri_no_rivals_remain_desc:0 "The restrictions that once preserved the prosperity of the Breton homeland have served their purpose. Our armies eclipse those of every rival, our fleets dominate the oceans, and no great power can match the wealth at our disposal. Brittany no longer needs to choose between the strength of the metropole and dominion over Europe."
 bri_breton_hegemony_modifier:0 "Breton Hegemony"
 bri_breton_hegemony_modifier_desc:0 "Having surpassed the great powers of the world in wealth and military strength, the Breton state possesses the administrative capacity to govern an empire on a scale once unimaginable."
 bri_no_rivals_remain_reward_tt:0 "The restriction on the §YBreton Metropole§! modifiers requiring §Y[Root.GetName]§! to own fewer than §Y10 provinces in Europe§! will be §Gpermanently removed§!."
 bri_five_colonial_nations_tt:0 "Own at least §Y5 Colonial Nations§!."
 bri_breton_colonial_empire_title:0 "A Colonial Empire"
 bri_breton_colonial_empire_desc:0 "What began as scattered settlements beyond the Atlantic has grown into a network of established colonial governments spanning the New World. Their wealth, markets, and political institutions now form an enduring part of the Breton state and its commercial system."
 bri_breton_colonial_empire_modifier:0 "A Colonial Empire"
 bri_breton_colonial_empire_modifier_desc:0 "The integration of numerous colonial governments into our wider commercial network has strengthened Breton trade and demonstrated the success of our overseas policies."
 bri_guinea_trade_title:0 "The Guinea Trade"
 bri_guinea_trade_desc:0 "A firm foothold along the Guinea coast gives Breton merchants access to the riches of West Africa and places our ships upon the routes leading farther south. From these ports we may either press inland toward the wealth of the Sahel or continue around Africa toward the Cape."
 bri_gold_of_mali_title:0 "The Gold of Mali"
 bri_gold_of_mali_desc:0 "The riches of the Malian interior have long flowed toward the markets of the coast. With the lands of Manding now under our control, this wealth may flow directly into Breton coffers. Yet such an abundance of gold must be carefully managed if newfound riches are not to undermine the value of our currency."
 bri_malian_gold_modifier:0 "Malian Gold"
 bri_malian_gold_modifier_desc:0 "The immense quantities of gold entering our treasury from Manding have demanded careful management of the Breton currency."
 bri_round_the_cape_title:0 "Round the Cape"
 bri_round_the_cape_desc:0 "Our presence at the Cape has opened the passage between the Atlantic and Indian Oceans to Breton ships. Beyond lie the ports of East Africa and Madagascar, where control of a few well-placed harbors may secure our entrance into the commerce of the Indian Ocean."
 bri_western_indian_ocean_title:0 "Into the Indian Ocean"
 bri_western_indian_ocean_desc:0 "Our possessions along Madagascar and the coast of Mozambique have given Breton ships a secure foothold in the western Indian Ocean. From these bases we can push north toward Zanzibar and east toward the rich ports of Ceylon, opening the way to the commerce of India and beyond."
 bri_conquer_ceylon_title:0 "Conquer Ceylon"
 bri_conquer_ceylon_desc:0 "Ceylon commands the sea lanes between India and the eastern seas. With the island secured, Breton merchants and warships gain a natural base from which to press into the markets of Bengal while extending our commercial reach toward the Straits of Malacca."
 bri_spice_trade_title:0 "The Spice Trade"
 bri_spice_trade_desc:0 "Our expansion into the eastern seas has secured direct access to the spices and cloves coveted in the markets of Europe. Breton merchants now stand at both ends of a commercial network stretching from the rich islands of the East Indies to the ports of our homeland."
 bri_spice_trade_modifier:0 "Masters of the Spice Trade"
 bri_spice_trade_modifier_desc:0 "Control over the sources of the eastern spice trade has enriched Breton merchants and greatly expanded the volume of goods passing through our global commercial network."
 bri_the_breton_estates_title:0 "The Breton Estates"
 bri_the_breton_estates_desc:0 "The government of the duchy rests upon more than the authority of the crown alone. Clergy, nobles, and towns each possess privileges, wealth, and influence that must be accommodated if Brittany is to be governed effectively. By securing their cooperation, we may strengthen the foundations of the state without surrendering the prerogatives of the crown."
 bri_the_breton_burghers_title:0 "Bargain with the Burghers"
 bri_the_breton_burghers_desc:0 "The merchants and townsmen of Brittany have become indispensable partners in the growth of the duchy. By granting them a meaningful voice in the affairs of state and responding to their concerns, we can bind their commercial interests more closely to those of the crown."
 bri_the_breton_clergy_title:0 "Confer with the Clergy"
 bri_the_breton_clergy_desc:0 "The Church stands at the heart of Breton society, its influence extending from the great ecclesiastical estates to the parishes and communities of the countryside. By working alongside the clergy and respecting their place within the duchy, we may strengthen both the stability of the realm and the institutions of the Breton state."
 bri_the_breton_nobility_title:0 "Negotiate with the Nobility"
 bri_the_breton_nobility_desc:0 "The noble houses of Brittany remain an essential pillar of the duchy, providing officers, soldiers, and local authority throughout the realm. By maintaining their confidence and drawing upon their military traditions, we can strengthen the state while easing the burden of maintaining our armies."
 bri_noble_military_support:0 "Noble Military Support"
 bri_noble_military_support_desc:0 "The cooperation of the Breton nobility has reduced the cost of maintaining the armies of the duchy."
 bri_constitutional_settlement_title:0 "A Constitutional Settlement"
 bri_constitutional_settlement_desc:0 "The estates of Brittany have long shared in the governance of the duchy, but custom alone is no longer sufficient for a state of our growing complexity. By defining the rights of the estates alongside the authority of the crown, we can transform centuries of negotiation into a stable and enduring system of government."
 bri_constitutional_settlement_reform:0 "Breton Constitutional Settlement"
 bri_constitutional_settlement_reform_desc:0 "The traditional rights of the Breton estates have been reconciled with the authority of the crown through a durable constitutional settlement. Clergy, nobility, and towns retain a recognized place within the government of the duchy, while clearly defined institutions prevent any one estate from overwhelming the state."